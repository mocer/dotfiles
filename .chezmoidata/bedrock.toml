# Shared Bedrock defaults for the "poste" profile.
#
# Personal application inference profile ARNs are NOT stored here: they are
# created once per user by `credential-process` and belong to the
# machine-local chezmoi configuration (~/.config/chezmoi/chezmoi.toml).
[bedrock]
region = "eu-central-1"
profile = "claude-code"

# Model used when Claude Code starts. One of: "opus", "sonnet", "haiku".
default_model = "sonnet"
