[settings]
auto_update = true

[tools]
# ── Cargo Ecosystem & Code Quality ────────────────────────────────────────
"cargo:cargo-audit" = "0.22.2"     # Audits Cargo.lock for security vulnerabilities
"cargo:cargo-cache" = "0.8.3"      # Manage/clean cargo home ($CARGO_HOME) cache
"cargo:cargo-deny" = "0.20.2"      # License and dependency auditor
"cargo:cargo-edit" = "0.13.13"     # Provides add, rm, set-version, upgrade
"cargo:cargo-expand" = "1.0.126"   # Macro expansion utility for debugging Rust code
"cargo:git-cliff" = "2.13.1"       # Highly customizable changelog generator
"cargo:grex" = "1.4.6"             # Generate regular expressions from user-provided test cases
"cargo:hyperfine" = "1.20.0"       # Command-line benchmarking tool
"cargo:cargo-machete" = "0.9.2"    # Detects unused dependencies in Cargo projects
"cargo:cargo-nextest" = "0.9.143"  # Next-generation test runner for Rust
"cargo:sqlx-cli" = "0.9.0"         # SQLX CLI (provides sqlx and cargo-sqlx)
"cargo:cargo-tarpaulin" = "0.37.2" # Code coverage tool
"cargo:tokei" = "14.0.0"           # Blazing fast code statistics (lines of code, etc.)
"cargo:cargo-watch" = "8.5.3"      # Watches project files and runs cargo commands on change

# ── Cloud & Docker Services CLI  ──────────────────────────────────────
aws-cli = { version = "2.36.34", symlink_bins = "true" }                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            #AWS CLI; PYTHON
gh = "2.98.0"                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       # Github CLI; GOLANG
oc = { version = "4.22.12", bin = "oc", platforms = { linux-arm64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-linux-arm64-{{ version }}.tar.gz" }, linux-x64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-linux-{{ version }}.tar.gz" }, macos-arm64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-mac-arm64-{{ version }}.tar.gz" }, macos-x64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-mac-{{ version }}.tar.gz" }, windows-x64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-windows-{{ version }}.zip" } }, checksum_url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/sha256sum.txt", version_expr = "sortVersions(versions)", version_list_url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/", version_regex = 'href="(\d+\.\d+\.\d+)/"' } # Openshift CLI; GOLANG

# ── Core Infrastructure & VCS ────────────────────────────────────────────
"cargo:cargo-binstall" = "1.22.0" # Required for fast binary installs
"cargo:ghr" = "0.4.5"             # Parallel GitHub repository manager and automated release tool
"cargo:just" = "1.58.0"           # Modern task runner and command organizer
"cargo:jj-cli" = "0.44.0"         # Next-generation Git-compatible VCS with operation log and safety features
"cargo:sccache" = "0.17.0"        # Compiler cache optimization

# ── OPTIMIZED TOOLS (Forced Compilation) ──────────────────────────────────
# Compiled from source with RUSTFLAGS for maximum local performance
# default-feature is workaround to force cargo build instead of cargo binstall
"cargo:fd-find" = { version = "10.5.0", default-features = "true" } # Optimized file discovery (fd)
"cargo:jaq" = { version = "3.1.1", default-features = "true" }      # A robust jq alternative with built-in support for YAML, CBOR, TOML, XML, and CSV/TSV, engineered for strict correctness.
"cargo:ripgrep" = { version = "15.2.0", default-features = "true" } # Fast line-oriented search tool (rg)
"cargo:skim" = { version = "5.6.6", default-features = "true" }     # Fuzzy finder written in Rust (sk)

# ── Runtimes & Editors (Highly pre-optimized rust binary or not rust binary  )────────────────────────────────────────────────────
"aqua:fish-shell/fish-shell" = "4.8.1" # Interactive shell used across macOS, Linux, and WSL2
deno = "2.9.6"                         # Secure runtime for JavaScript, TypeScript, and JSX
helix = "25.07.1"                      # Post-modern modal text editor with built-in LSP
usql = "0.21.4"                        # Universal command-line interface for SQL databases (Postgres, MySQL, SQLite, etc.); GOLANG
uv = "0.12.7"                          # Python package manager
claude-code = "2.1.248"                # May the prompt be with you: Anthropic's CLI agent

# ── Shell Productivity Tools (v8 Standard) ────────────────────────────────
"cargo:atuin" = "18.20.1"                       # SQLite-backed shell history sync and search
"cargo:bat" = "0.26.1"                          # Cat clone with syntax highlighting
"cargo:bottom" = "0.14.9"                       # Cross-platform graphical process/system monitor (btm)
"cargo:eza" = "0.23.5"                          # Modern replacement for ls
"cargo:kcli" = "0.1.0"                          # Fast and simple Kakfa client
"github:Feel-ix-343/markdown-oxide" = "0.25.12" # Markdown LSP
"cargo:ouch" = "0.8.0"                          # Painless compression and decompression for any format
"cargo:rip2" = "0.9.6"                          # A safer, rust-based rm
"cargo:sd" = "1.0.0"                            # Intuitive find and replace (sed alternative)
"cargo:starship" = "1.26.0"                     # Minimal, blazing-fast, and infinitely customizable shell prompt
"cargo:taplo-cli" = "0.10.0"                    # Feature-rich TOML toolkit, linter, and formatter
usage = "6.4.1"                                 # Usage is a spec and CLI for defining CLI tools
"cargo:xh" = "0.26.2"                           # Fast and user-friendly HTTP client
"cargo:zoxide" = "0.10.0"                       # Smart cd command (z)

# ── Secrets & Environment Management ──────────────────────────────────────
sops = "3.13.3"         # Edit and manage SOPS-encrypted secret files
"cargo:rage" = "0.12.1" # Modern and secure file encryption tool manage age-compatible identities

# ── Languages ──────────────────────────────────────
python = "3.14.7"
